name: Release

# On a push to main, release entries open or update the version PR. Merging
# that PR publishes the approved packages to npm with provenance.

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write
  id-token: write # npm provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Prepare Changesets base branch
        run: |
          git show-ref --verify --quiet refs/heads/main ||
            git branch --track main origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.12.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate launch changeset
        run: pnpm test:launch

      - name: Test with coverage (100% enforced)
        run: pnpm test:coverage

      - name: Bundle-size guard (core stays lean)
        run: |
          SIZE=$(gzip -c packages/core/dist/index.mjs | wc -c)
          echo "core ESM gzipped: ${SIZE} bytes (budget 20000)"
          if [ "$SIZE" -gt 20000 ]; then
            echo "::error::@glucoseiq/core exceeds the 20KB gzipped budget (${SIZE} bytes)"
            exit 1
          fi

      - name: Test packed packages
        run: pnpm test:packages

      - name: Build documentation
        run: pnpm --filter docs build

      - name: Detect release entries
        id: release-mode
        run: |
          RELEASE_ENTRIES=$(git ls-files '.changeset/*.md' ':(exclude).changeset/README.md')

          if [ -n "$RELEASE_ENTRIES" ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.release-mode.outputs.has_changesets == 'true'
        run: pnpm changeset version

      - name: Create or update release PR
        if: steps.release-mode.outputs.has_changesets == 'true'
        id: version-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/glucoseiq-packages
          delete-branch: true
          base: main
          commit-message: 'chore(release): version packages'
          title: 'chore(release): version packages'
          body-path: .github/release-pr-body.md
          add-paths: |
            .changeset/*.md
            packages/*/package.json
            packages/*/CHANGELOG.md
            pnpm-lock.yaml
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          sign-commits: true

      - name: Publish packages
        if: steps.release-mode.outputs.has_changesets == 'false'
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Preserve legacy npm release
        if: always() && steps.release-mode.outputs.has_changesets == 'false' && steps.changesets.outcome != 'skipped'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          SHIM_VERSION=$(node -p "require('./packages/diabetic-utils/package.json').version")

          if [ "$SHIM_VERSION" != "2.0.0" ] || [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            exit 0
          fi

          npm dist-tag add diabetic-utils@1.5.0 legacy \
            --registry=https://registry.npmjs.org

          for _ in 1 2 3 4 5 6; do
            LEGACY_VERSION=$(npm view diabetic-utils dist-tags.legacy \
              --registry=https://registry.npmjs.org 2>/dev/null || true)

            if [ "$LEGACY_VERSION" = "1.5.0" ]; then
              exit 0
            fi

            sleep 5
          done

          echo "::error::The legacy npm tag does not resolve to diabetic-utils@1.5.0"
          exit 1

      - name: Run CI for release PR
        if: steps.version-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.version-pr.outputs.pull-request-number }}
        run: |
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$HEAD_REF"
